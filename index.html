<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ติดตามสถานะซ่อมเครื่อง P3</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f6fb;--card:#fff;--tx:#1b2340;--mu:#6b7490;--bd:#e1e6f0;--pri:#2f5fd0;
--Station:#7d8590;--ITS:#4a86d8;--Loxbit:#ee8a3c;--HR:#8a63c2;--ODOO:#2fa39a;--DOC:#2fa39a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141f;--card:#1a2031;--tx:#e8ecf7;--mu:#97a0b8;--bd:#2b3350;--pri:#6c93f0}}
:root[data-theme="dark"]{--bg:#10141f;--card:#1a2031;--tx:#e8ecf7;--mu:#97a0b8;--bd:#2b3350;--pri:#6c93f0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:8px 0 14px;color:var(--pri)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.add{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
input,select,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 12px}
input{flex:1;min-width:140px}
button{cursor:pointer}
button.p{background:var(--pri);border-color:var(--pri);color:#fff}
button:disabled{opacity:.4;cursor:default}
.sum{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.chip{flex:0 0 auto;border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:5px 12px;font-size:.85rem;cursor:pointer}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.m{cursor:pointer}
.m:hover{border-color:var(--pri)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{color:#fff;font-size:.75rem;padding:2px 10px;border-radius:8px;white-space:nowrap}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--pri)}
.mu{color:var(--mu);font-size:.85rem}
.tl{margin:14px 0 0;padding:0;list-style:none}
.tl li{display:flex;gap:10px;padding:8px 0;border-left:2px solid var(--bd);margin-left:13px;padding-left:16px;position:relative}
.tl .n{position:absolute;left:-14px;top:6px;width:26px;height:26px;border-radius:50%;background:var(--bd);color:var(--mu);display:grid;place-items:center;font-size:.8rem;font-weight:700}
.tl li.done .n{background:var(--ODOO);color:#fff}
.tl li.cur .n{background:var(--pri);color:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 25%,transparent)}
.tl li.cur{font-weight:700}
.tl li.todo{color:var(--mu)}
.tl ul{margin:2px 0 0;padding-left:18px;font-weight:400;font-size:.85rem}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:16px}
.modal.show{display:flex}
.modal .card{width:100%;max-width:560px;margin:auto}
.empty{text-align:center;color:var(--mu);padding:30px}
</style>
</head>
<body>
<div class="wrap">
<h1>ติดตามสถานะซ่อมเครื่อง P3</h1>
<div class="add">
<input id="mid" placeholder="รหัส/ชื่อเครื่อง เช่น P3-001">
<input id="mst" placeholder="อู่/สถานี (Station)">
<button class="p" onclick="addM()">+ เปิดเคสใหม่</button>
</div>
<div class="add" style="justify-content:flex-end">
<button onclick="exportCSV()">⬇ Export CSV (Excel)</button>
<button onclick="exportJSON()">⬇ Export JSON (สำรองข้อมูล)</button>
<button onclick="document.getElementById('imp').click()">⬆ Import JSON</button>
<input type="file" id="imp" accept=".json,application/json" hidden onchange="importJSON(event)">
</div>
<div class="sum" id="sum"></div>
<div class="grid" id="list"></div>
</div>
<div class="modal" id="modal" onclick="if(event.target===this)closeM()"><div class="card" id="detail"></div></div>

<script>
const STEPS=[
["อู่เปิดเคสแจ้งปัญหาเครื่อง P3","Station"],
["ฝ่าย ITS แจ้งส่งเครื่องเสียให้ Loxbit","ITS"],
["Loxbit ให้ขนส่งมารับเครื่อง","Loxbit"],
["Loxbit ประเมินและแจ้งราคาซ่อม","Loxbit"],
["ITS จัดทำ Memo แจ้ง HR รับทราบค่าใช้จ่าย","ITS"],
["HR จัดทำเอกสารรับสภาพหนี้","HR"],
["HR ส่งสำเนาเอกสารรับสภาพหนี้ให้ ฝ่าย ITS","HR"],
["ITS แจ้ง Loxbit อนุมัติซ่อม","ITS"],
["ITS เปิด PR","ITS"],
["อนุมัติ PR","ODOO"],
["เปิด PO","ODOO"],
["ขอใบแจ้งหนี้จาก Loxbit","ITS"],
["ส่งเอกสารให้ฝ่าย ACC","เอกสาร",["ใบแจ้งหนี้","Memo แจ้งค่าใช้จ่าย","สำเนาเอกสารรับสภาพหนี้"]]
];
const N=STEPS.length, KEY="p3_repair_v1";
let data=[], filter="all", openId=null;
try{data=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){data=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
const col=o=>`var(--${o==="เอกสาร"?"DOC":o})`;
const fmt=t=>new Date(t).toLocaleString("th-TH",{dateStyle:"short",timeStyle:"short"});
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function addM(){
  const id=document.getElementById("mid").value.trim();
  if(!id)return;
  const st=document.getElementById("mst").value.trim();
  data.unshift({id:Date.now(),name:id,station:st,step:1,log:[{s:1,t:Date.now()}]});
  document.getElementById("mid").value="";document.getElementById("mst").value="";
  save();render();
}
function move(id,d){
  const m=data.find(x=>x.id===id);
  const ns=m.step+d;
  if(ns<1||ns>N+1)return;
  if(d>0)m.log.push({s:ns,t:Date.now()});
  else m.log=m.log.filter(l=>l.s<m.step);
  m.step=ns;save();render();
}
function del(id){
  if(!confirm("ลบเครื่องนี้ออกจากรายการ?"))return;
  data=data.filter(x=>x.id!==id);closeM();save();render();
}
function openM(id){openId=id;render();document.getElementById("modal").classList.add("show")}
function closeM(){openId=null;document.getElementById("modal").classList.remove("show")}

function render(){
  // summary chips
  const counts={};data.forEach(m=>counts[m.step]=(counts[m.step]||0)+1);
  let h=`<div class="chip ${filter==="all"?"on":""}" onclick="setF('all')">ทั้งหมด (${data.length})</div>`;
  h+=`<div class="chip ${filter==="active"?"on":""}" onclick="setF('active')">กำลังดำเนินการ (${data.filter(m=>m.step<=N).length})</div>`;
  h+=`<div class="chip ${filter==="done"?"on":""}" onclick="setF('done')">เสร็จสิ้น (${counts[N+1]||0})</div>`;
  for(let i=1;i<=N;i++)if(counts[i])h+=`<div class="chip ${filter==i?"on":""}" onclick="setF(${i})">ขั้น ${i} (${counts[i]})</div>`;
  document.getElementById("sum").innerHTML=h;

  const list=data.filter(m=>filter==="all"||(filter==="active"?m.step<=N:filter==="done"?m.step>N:m.step==filter));
  document.getElementById("list").innerHTML=list.length?list.map(m=>{
    const done=m.step>N, s=STEPS[Math.min(m.step,N)-1];
    const pct=Math.round((Math.min(m.step-1,N))/N*100);
    return `<div class="card m" onclick="openM(${m.id})">
      <div class="row"><b>${esc(m.name)}</b>${done?`<span class="tag" style="background:var(--ODOO)">เสร็จสิ้น</span>`:`<span class="tag" style="background:${col(s[1])}">${s[1]}</span>`}</div>
      <div class="mu">${esc(m.station||"-")}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="row mu"><span>${done?"ส่งเอกสารให้ ACC แล้ว":`ขั้น ${m.step}/${N}: ${s[0]}`}</span><span>${pct}%</span></div>
    </div>`}).join(""):`<div class="empty">ยังไม่มีเครื่องในรายการ — เพิ่มเคสใหม่ด้านบน</div>`;

  // detail
  if(openId){
    const m=data.find(x=>x.id===openId);
    if(!m){closeM();return}
    const done=m.step>N;
    document.getElementById("detail").innerHTML=`
      <div class="row"><b style="font-size:1.15rem">${esc(m.name)}</b><button onclick="closeM()">✕</button></div>
      <div class="mu">${esc(m.station||"-")} · ${done?"เสร็จสิ้นทุกขั้นตอน":`อยู่ขั้นที่ ${m.step} จาก ${N}`}</div>
      <ul class="tl">${STEPS.map((s,i)=>{
        const n=i+1,cls=m.step>n?"done":m.step===n?"cur":"todo",lg=m.log.find(l=>l.s===n);
        return `<li class="${cls}"><span class="n">${m.step>n?"✓":n}</span><div style="flex:1">
          <div class="row"><span>${s[0]}</span><span class="tag" style="background:${col(s[1])}">${s[1]}</span></div>
          ${s[2]?`<ul>${s[2].map(x=>`<li style="border:0;padding:0;margin:0;display:list-item">${x}</li>`).join("")}</ul>`:""}
          ${lg?`<div class="mu">${fmt(lg.t)}</div>`:""}</div></li>`}).join("")}</ul>
      <div class="acts">
        <button onclick="move(${m.id},-1)" ${m.step<=1?"disabled":""}>← ย้อนขั้นตอน</button>
        <button class="p" onclick="move(${m.id},1)" ${done?"disabled":""}>${m.step===N?"เสร็จสิ้น ✓":"ไปขั้นถัดไป →"}</button>
        <button onclick="del(${m.id})" style="margin-left:auto">ลบ</button>
      </div>`;
  }
}

function dl(name,text,type){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type}));
  a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
const stamp=()=>new Date().toISOString().slice(0,10);
function exportJSON(){dl(`p3-repair-${stamp()}.json`,JSON.stringify(data,null,2),"application/json")}
function exportCSV(){
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const head=["รหัสเครื่อง","Station","สถานะ","ขั้นปัจจุบัน","ชื่อขั้นตอนปัจจุบัน","ฝ่ายที่รับผิดชอบ","วันที่เปิดเคส",
    ...STEPS.map((s,i)=>`วันที่ขั้น ${i+1}: ${s[0]}`)];
  const rows=data.map(m=>{
    const done=m.step>N,s=STEPS[Math.min(m.step,N)-1];
    return [m.name,m.station,done?"เสร็จสิ้น":"กำลังดำเนินการ",done?N:m.step,done?"ส่งเอกสารให้ ACC แล้ว":s[0],done?"-":s[1],
      fmt(m.id),...STEPS.map((_,i)=>{const l=m.log.find(x=>x.s===i+1);return l?fmt(l.t):""})];
  });
  const csv=[head,...rows].map(r=>r.map(q).join(",")).join("\r\n");
  dl(`p3-repair-${stamp()}.csv`,"\ufeff"+csv,"text/csv;charset=utf-8");
}
function importJSON(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const arr=JSON.parse(r.result);
      if(!Array.isArray(arr))throw 0;
      if(!confirm(`นำเข้า ${arr.length} รายการ? ข้อมูลปัจจุบันจะถูกแทนที่`))return;
      data=arr;save();render();
    }catch(x){alert("ไฟล์ JSON ไม่ถูกต้อง")}
    e.target.value="";
  };
  r.readAsText(f);
}
function setF(f){filter=f;render()}
render();
</script>
</body>
</html>
