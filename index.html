<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ติดตามสถานะซ่อมเครื่อง P3</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f6fb;--card:#fff;--tx:#1b2340;--mu:#6b7490;--bd:#e1e6f0;--pri:#2f5fd0;--ok:#2fa39a;--warn:#c9831f;
--Station:#7d8590;--ITS:#4a86d8;--Loxbit:#ee8a3c;--HR:#8a63c2;--ODOO:#2fa39a;--DOC:#2fa39a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141f;--card:#1a2031;--tx:#e8ecf7;--mu:#97a0b8;--bd:#2b3350;--pri:#6c93f0}}
:root[data-theme="dark"]{--bg:#10141f;--card:#1a2031;--tx:#e8ecf7;--mu:#97a0b8;--bd:#2b3350;--pri:#6c93f0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:8px 0 14px;color:var(--pri)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.add{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 12px}
input[type=text]{flex:1;min-width:130px}
button{cursor:pointer}
button.p{background:var(--pri);border-color:var(--pri);color:#fff}
button.sel{border-color:var(--pri);color:var(--pri);font-weight:700}
button:disabled{opacity:.4;cursor:default}
.sum{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.chip{flex:0 0 auto;border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:5px 12px;font-size:.85rem;cursor:pointer}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.m{cursor:pointer}.m:hover{border-color:var(--pri)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{color:#fff;font-size:.75rem;padding:2px 10px;border-radius:8px;white-space:nowrap}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--pri)}
.mu{color:var(--mu);font-size:.85rem}
.tl{margin:14px 0 0;padding:0;list-style:none}
.tl>li{display:flex;gap:10px;padding:8px 0;border-left:2px solid var(--bd);margin-left:13px;padding-left:16px;position:relative}
.n{position:absolute;left:-14px;top:6px;width:26px;height:26px;border-radius:50%;background:var(--bd);color:var(--mu);display:grid;place-items:center;font-size:.8rem;font-weight:700}
.done .n{background:var(--ok);color:#fff}
.cur .n{background:var(--pri);color:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 25%,transparent)}
.cur{font-weight:700}.todo{color:var(--mu)}
.files{font-weight:400;font-size:.85rem;margin-top:4px}
.files a{color:var(--pri);display:block}
.gate{color:var(--warn);font-weight:400;font-size:.85rem}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:16px}
.modal.show{display:flex}
.modal .card{width:100%;max-width:580px;margin:auto}
.empty{text-align:center;color:var(--mu);padding:30px}
.note{background:color-mix(in srgb,var(--warn) 15%,transparent);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:.9rem}
</style>
</head>
<body>
<div class="wrap">
<h1>ติดตามสถานะซ่อมเครื่อง P3</h1>
<div id="note"></div>
<div class="add">
<input type="text" id="sn" placeholder="S/N">
<input type="text" id="issue" placeholder="อาการ/ปัญหา">
<input type="text" id="st" placeholder="อู่">
<button class="p" onclick="addM()">+ เปิดเคสใหม่</button>
</div>
<div class="add" style="justify-content:flex-end"><button onclick="exportCSV()">⬇ Export CSV (Excel)</button></div>
<div class="sum" id="sum"></div>
<div class="grid" id="list"></div>
</div>
<div class="modal" id="modal" onclick="if(event.target===this)closeM()"><div class="card" id="detail"></div></div>

<script>
const C=[["c1","อู่เปิดเคส (S/N, อาการ/ปัญหา, อู่)","Station"],["c2","ITS แจ้งส่งเครื่องเสียให้ Loxbit","ITS"],["c3","Loxbit ให้ขนส่งมารับเครื่อง","Loxbit"],["c4","Loxbit ประเมินและแจ้งราคาซ่อม","Loxbit"]];
const W=[["w1","Loxbit ซ่อมและจัดส่งคืน","Loxbit"]];
const O=[["o1","ITS ทำ Memo แจ้ง HR รับทราบค่าใช้จ่าย","ITS","memo"],["o2","HR ทำเอกสารรับสภาพหนี้","HR"],["o3","HR ส่งสำเนาเอกสารรับสภาพหนี้ให้ ITS","HR","copy"],["o4","ITS แจ้ง Loxbit อนุมัติซ่อม","ITS"],["o5","ITS เปิด PR","ITS"],["o6","อนุมัติ PR","ODOO"],["o7","เปิด PO","ODOO"],["o8","ขอใบแจ้งหนี้จาก Loxbit","ITS","inv"],["o9","ส่งเอกสารให้ฝ่าย ACC","เอกสาร",null,["inv","memo","copy"]]];
const E=["e","ITS รับเครื่อง","ITS"];
const DN={memo:"Memo แจ้งค่าใช้จ่าย",copy:"สำเนาเอกสารรับสภาพหนี้",inv:"ใบแจ้งหนี้"};
const ALL=[...C,...W,...O,E];
const path=m=>[...C,...(m.type==="in"?W:m.type==="out"?O:[]),E];
let db,user,assets,dl,col,data=[],filter="all",openId=null,me={name:"ผู้ใช้"};
const colr=o=>`var(--${o==="เอกสาร"?"DOC":o})`;
const fmt=t=>new Date(t).toLocaleString("th-TH",{dateStyle:"short",timeStyle:"short"});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const get=id=>data.find(x=>x.id===id);
const note=t=>document.getElementById("note").innerHTML=t?`<div class="note">${t}</div>`:"";
const fail=e=>alert("ทำรายการไม่สำเร็จ (อาจไม่มีสิทธิ์แก้ไข): "+(e&&(e.message||e.code)||e));

const FIREBASE_CONFIG=null; /* วาง config ของ Firebase ตรงนี้ เช่น {apiKey:"...",authDomain:"...",projectId:"...",storageBucket:"...",appId:"..."} ถ้าเป็น null จะทำงานแบบเครื่องเดียว */
let store;
function localStore(){
  const K="p3_cases_v2",rd=()=>{try{return JSON.parse(localStorage.getItem(K)||"[]")}catch(e){return[]}};
  let cb=()=>{};const wr=a=>{localStorage.setItem(K,JSON.stringify(a));cb(a)};
  return{sub:f=>{cb=f;f(rd())},
   add:async o=>{const a=rd();a.push({...o,id:"c"+Date.now()});wr(a)},
   update:async(id,o)=>wr(rd().map(x=>x.id===id?{...x,...o}:x)),
   del:async id=>wr(rd().filter(x=>x.id!==id)),
   upload:f=>new Promise((ok,no)=>{if(f.size>1.5e6)return no({message:"โหมดเครื่องเดียวรองรับไฟล์ไม่เกิน 1.5MB"});const r=new FileReader();r.onload=()=>ok({url:r.result});r.onerror=no;r.readAsDataURL(f)})}
}
async function fbStore(){
  const V="https://www.gstatic.com/firebasejs/10.12.2/";
  const [{initializeApp},fs,st]=await Promise.all([import(V+"firebase-app.js"),import(V+"firebase-firestore.js"),import(V+"firebase-storage.js")]);
  const app=initializeApp(FIREBASE_CONFIG),d=fs.getFirestore(app),sg=st.getStorage(app),c=fs.collection(d,"cases");
  return{sub:f=>fs.onSnapshot(c,q=>f(q.docs.map(x=>({...x.data(),id:x.id}))),e=>note("โหลดข้อมูลไม่สำเร็จ: "+esc(e.message))),
   add:o=>fs.addDoc(c,o),update:(id,o)=>fs.updateDoc(fs.doc(d,"cases",id),o),del:id=>fs.deleteDoc(fs.doc(d,"cases",id)),
   upload:async f=>{const r=st.ref(sg,"docs/"+Date.now()+"_"+f.name);await st.uploadBytes(r,f);return{url:await st.getDownloadURL(r)}}}
}
const API_URL="https://p3-repair-api.tawan-its.workers.dev";
function apiStore(){
  let tok=localStorage.getItem("p3_tok")||"",cb=()=>{};
  const ask=()=>{tok=prompt("รหัสผ่านเข้าระบบ")||"";localStorage.setItem("p3_tok",tok)};
  const req=async(p,o={})=>{
    const go=()=>fetch(API_URL+p,{...o,headers:{Authorization:"Bearer "+tok,...(o.headers||{})}});
    let r=await go();
    if(r.status===401){ask();r=await go()}
    if(!r.ok)throw{message:r.status===401?"รหัสผ่านไม่ถูกต้อง":"HTTP "+r.status};
    return r};
  const load=async()=>{try{cb(await(await req("/cases")).json());note("")}catch(e){note("โหลดข้อมูลไม่สำเร็จ: "+esc(e.message))}};
  const J={"Content-Type":"application/json"};
  return{sub:f=>{cb=f;load();setInterval(()=>{if(!document.hidden)load()},8000)},
   add:async o=>{await req("/cases",{method:"POST",headers:J,body:JSON.stringify(o)});await load()},
   update:async(id,o)=>{await req("/cases/"+id,{method:"PATCH",headers:J,body:JSON.stringify(o)});await load()},
   del:async id=>{await req("/cases/"+id,{method:"DELETE"});await load()},
   upload:async f=>{
     const blob=f.type.startsWith("image/")?await shrink(f):f;
     if(blob.size>6e6)throw{message:"ไฟล์ใหญ่เกิน 6MB — กรุณาบีบอัดไฟล์ก่อนแนบ"};
     const b64=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(",")[1]);r.onerror=no;r.readAsDataURL(blob)});
     const fid=crypto.randomUUID(),S=1500000,n=Math.max(1,Math.ceil(b64.length/S)),ty=blob.type||f.type||"application/octet-stream";
     for(let i=0;i<n;i++)await req(`/upload?fid=${fid}&i=${i}&type=${encodeURIComponent(ty)}`,{method:"POST",headers:{"Content-Type":"text/plain"},body:b64.slice(i*S,(i+1)*S)});
     return{url:"d1:"+fid}},
   file:async k=>{const j=await(await req("/files/"+k)).json(),bin=atob(j.b64),u=new Uint8Array(bin.length);
     for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:j.type})}};
}
const shrink=f=>new Promise(ok=>{const im=new Image();im.onload=()=>{const s=Math.min(1,1800/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(b=>ok(b||f),"image/jpeg",.8)};im.onerror=()=>ok(f);im.src=URL.createObjectURL(f)});
async function openFile(k){const w=window.open("","_blank");try{w.location=URL.createObjectURL(await store.file(k))}catch(e){if(w)w.close();fail(e)}}
async function initStore(){
  let n=localStorage.getItem("p3_name");if(!n){n=prompt("ชื่อของคุณ (ใช้บันทึกผู้ทำรายการ)")||"ผู้ใช้";localStorage.setItem("p3_name",n)}
  me={name:n};assets=true;dl=true;
  try{store=API_URL?apiStore():FIREBASE_CONFIG?await fbStore():localStore()}catch(e){note("เชื่อมต่อ Firebase ไม่ได้: "+esc(e.message));store=localStore()}
  if(!FIREBASE_CONFIG&&!API_URL)note("โหมดเครื่องเดียว: ข้อมูลอยู่ในเบราว์เซอร์นี้เท่านั้น — ตั้งค่า Firebase เพื่อใช้ร่วมกันหลายคน");
  store.sub(a=>{data=a.sort((x,y)=>y.created-x.created);render()});
}

async function addM(){
  if(!store)return;
  const g=i=>document.getElementById(i),sn=g("sn").value.trim();
  if(!sn)return;
  try{await store.add({name:sn,sn,issue:g("issue").value.trim(),station:g("st").value.trim(),type:"",step:0,created:Date.now(),log:{c1:{t:Date.now(),by:me.name}},docs:{}});
    ["sn","issue","st"].forEach(i=>g(i).value="")}catch(e){fail(e)}
}
async function go(id,d){
  const m=get(id),p=path(m),ns=m.step+d;
  if(ns<0||ns>p.length)return;
  const log={...(m.log||{})};
  if(d>0){log[ns<p.length?p[ns][0]:"done"]={t:Date.now(),by:me.name}}
  else delete log[m.step<p.length?p[m.step][0]:"done"];
  try{await store.update(id,{step:ns,log})}catch(e){fail(e)}
}
async function setType(id,t){try{await store.update(id,{type:t})}catch(e){fail(e)}}
async function del(id){if(!confirm("ลบเคสนี้ออกจากรายการ?"))return;try{await store.del(id);closeM()}catch(e){fail(e)}}
async function up(id,key,inp){
  const f=inp.files[0];if(!f)return;
  if(!assets){alert("ไม่มีสิทธิ์อัปโหลดไฟล์");return}
  try{const r=await store.upload(f),m=get(id),docs={...(m.docs||{})};
    docs[key]=[...(docs[key]||[]),{url:r.url,name:f.name,by:me.name,t:Date.now()}];
    await store.update(id,{docs})}catch(e){fail(e)}
  inp.value="";
}
function openM(id){openId=id;render();document.getElementById("modal").classList.add("show")}
function closeM(){openId=null;document.getElementById("modal").classList.remove("show")}
function setF(f){filter=f;render()}
const isDone=m=>m.step>=path(m).length;
const files=(m,k)=>(m.docs?.[k]||[]).map(f=>`<a href="${f.url.startsWith("d1:")?"#":esc(f.url)}" ${f.url.startsWith("d1:")?`onclick="openFile('${esc(f.url.slice(3))}');return false"`:'target="_blank" rel="noopener"'}>📎 ${esc(f.name)} <span class="mu">· ${esc(f.by)} ${fmt(f.t)}</span></a>`).join("");

function render(){
  const chips=[["all","ทั้งหมด",data.length],["active","กำลังดำเนินการ",data.filter(m=>!isDone(m)).length],["done","เสร็จสิ้น",data.filter(isDone).length],["in","ในประกัน",data.filter(m=>m.type==="in").length],["out","นอกประกัน",data.filter(m=>m.type==="out").length]];
  document.getElementById("sum").innerHTML=chips.map(c=>`<div class="chip ${filter===c[0]?"on":""}" onclick="setF('${c[0]}')">${c[1]} (${c[2]})</div>`).join("");
  const list=data.filter(m=>filter==="all"||(filter==="active"?!isDone(m):filter==="done"?isDone(m):m.type===filter));
  document.getElementById("list").innerHTML=list.length?list.map(m=>{
    const p=path(m),done=isDone(m),s=p[Math.min(m.step,p.length-1)],pct=Math.round(Math.min(m.step,p.length)/p.length*100);
    return `<div class="card m" onclick="openM('${m.id}')">
      <div class="row"><b>${esc(m.sn||m.name)}</b>${done?`<span class="tag" style="background:var(--ok)">เสร็จสิ้น</span>`:`<span class="tag" style="background:${colr(s[2])}">${esc(s[2])}</span>`}</div>
      <div class="mu">${esc(m.station||"-")} · ${m.type==="in"?"ในประกัน":m.type==="out"?"นอกประกัน":"รอประเมิน"}</div>
      <div class="mu">${esc(m.issue||"")}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="row mu"><span>${done?"ITS รับเครื่องแล้ว":esc(s[1])}</span><span>${pct}%</span></div></div>`}).join(""):`<div class="empty">ยังไม่มีเคส — เปิดเคสใหม่ด้านบน</div>`;

  if(!openId)return;
  const m=get(openId);if(!m){closeM();return}
  const p=path(m),done=isDone(m),cur=p[m.step],atAssess=m.step===3;
  const need=cur&&cur[3],blocked=(need&&!(m.docs?.[need]||[]).length)||(atAssess&&!m.type);
  document.getElementById("detail").innerHTML=`
    <div class="row"><b style="font-size:1.15rem">S/N ${esc(m.sn||m.name)}</b><button onclick="closeM()">✕</button></div>
    <div class="mu">${esc(m.station||"-")} · ${esc(m.issue||"-")}</div>
    <div class="mu">${done?"เสร็จสิ้นทุกขั้นตอน":`ขั้นที่ ${m.step+1} จาก ${p.length}`}</div>
    ${atAssess?`<div class="acts"><span>ผลประเมิน:</span><button class="${m.type==="in"?"sel":""}" onclick="setType('${m.id}','in')">อาการเสียอยู่ในประกัน</button><button class="${m.type==="out"?"sel":""}" onclick="setType('${m.id}','out')">อาการเสียนอกประกัน</button></div>`:""}
    <ul class="tl">${p.map((s,i)=>{
      const cls=m.step>i?"done":m.step===i?"cur":"todo",lg=m.log?.[s[0]];
      const ks=s[4]||(s[3]?[s[3]]:[]);
      return `<li class="${cls}"><span class="n">${m.step>i?"✓":i+1}</span><div style="flex:1">
        <div class="row"><span>${esc(s[1])}</span><span class="tag" style="background:${colr(s[2])}">${esc(s[2])}</span></div>
        ${ks.map(k=>`<div class="files">${DN[k]}${files(m,k)||` <span class="mu">— ยังไม่มีไฟล์</span>`}</div>`).join("")}
        ${cls==="cur"&&s[3]?`<div class="gate">⚠ ต้องแนบ${DN[s[3]]}ก่อนไปขั้นถัดไป</div>${assets?`<input type="file" accept=".pdf,image/*" onchange="up('${m.id}','${s[3]}',this)" style="margin-top:6px;width:100%">`:""}`:""}
        ${lg?`<div class="mu">${fmt(lg.t)} · ${esc(lg.by)}</div>`:""}</div></li>`}).join("")}
      ${!m.type&&!done?`<li class="todo"><span class="n">…</span><div class="mu">ขั้นตอนต่อไปจะแสดงหลังเลือกผลประเมิน</div></li>`:""}
      ${done?`<li class="done"><span class="n">✓</span><div class="mu">ปิดงาน ${fmt(m.log?.done?.t||Date.now())} · ${esc(m.log?.done?.by||"")}</div></li>`:""}</ul>
    <div class="acts">
      <button onclick="go('${m.id}',-1)" ${m.step<=0?"disabled":""}>← ย้อนขั้นตอน</button>
      <button class="p" onclick="go('${m.id}',1)" ${done||blocked?"disabled":""}>${m.step===p.length-1?"เสร็จสิ้น ✓":"ไปขั้นถัดไป →"}</button>
      <button onclick="del('${m.id}')" style="margin-left:auto">ลบ</button></div>`;
}

async function exportCSV(){
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const head=["S/N","อาการ/ปัญหา","อู่","ประเภท","สถานะ","ขั้นปัจจุบัน","วันที่เปิดเคส",...ALL.map(s=>"วันที่: "+s[1]),"วันที่ปิดงาน","ไฟล์แนบ"];
  const rows=data.map(m=>{const p=path(m),d=isDone(m);
    return [m.sn||m.name,m.issue,m.station,m.type==="in"?"ในประกัน":m.type==="out"?"นอกประกัน":"รอประเมิน",d?"เสร็จสิ้น":"กำลังดำเนินการ",d?"ITS รับเครื่องแล้ว":p[m.step][1],fmt(m.created),
      ...ALL.map(s=>m.log?.[s[0]]?fmt(m.log[s[0]].t):""),m.log?.done?fmt(m.log.done.t):"",
      Object.entries(m.docs||{}).flatMap(([k,a])=>a.map(f=>DN[k]+": "+f.name)).join(" | ")]});
  const csv="\ufeff"+[head,...rows].map(r=>r.map(q).join(",")).join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download=`p3-repair-${new Date().toISOString().slice(0,10)}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)
}
render();initStore();
</script>
</body>
</html>
